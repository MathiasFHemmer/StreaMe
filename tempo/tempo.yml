multitenancy_enabled: false
auth_enabled: false

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "tempo:4317"
        http:

ingester:
  trace_idle_period: 10s
  max_block_duration: 5m

querier:
  max_concurrent_queries: 10
  trace_by_id:
    query_timeout: 5m
  search:
    query_timeout: 5m
  
metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator-wal

compactor:
  compaction:
    block_retention: 1h

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
